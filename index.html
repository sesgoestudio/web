<style>
:root{--bg:#F7F5EE;--bg-alt:#EFECE2;--ink:#111;--mut:#55534E;--accent:#6374E8;--accent-soft:#DCE0FA;--card:#fff;--paper:#fff;--line:#E0DDD2;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--accent);color:#fff}

/* ===== INTRO (solo transform + opacity = fluida) ===== */
#intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg);transition:transform .75s cubic-bezier(.77,0,.175,1)}
#intro.hidden{transform:translate3d(0,-100%,0);pointer-events:none}
.logo{position:relative;width:min(80vw,640px);aspect-ratio:1400 / 781}
.logo img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:translate3d(0,0,0);backface-visibility:hidden;will-change:transform,opacity}
.go .star{animation:star .9s var(--ease) forwards}
.go .l{animation:rise .6s var(--ease) forwards}
.go .l0{animation-delay:.25s}.go .l1{animation-delay:.31s}.go .l2{animation-delay:.37s}.go .l3{animation-delay:.43s}.go .l4{animation-delay:.49s}
.go .dot{animation:drop .5s var(--ease) .75s forwards}
.go .tag{animation:fade .6s var(--ease) .95s forwards}
@keyframes star{from{opacity:0;transform:translate3d(0,0,0) rotate(-18deg) scale(.88)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes rise{from{opacity:0;transform:translate3d(0,8%,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes drop{from{opacity:0;transform:translate3d(0,-60%,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes fade{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:translate3d(0,0,0)}}

/* ===== FONDO ===== */
.bg-star{position:fixed;right:-140px;top:10%;width:600px;opacity:.1;pointer-events:none;z-index:0;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== LAYOUT + HEADER ===== */
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 24px 72px}
header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:24px;margin:0 -24px 40px;padding:12px 24px;background:rgba(247,245,238,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1.5px solid var(--ink)}
.brand{display:inline-flex;line-height:0}
.brand img{height:46px;width:auto;display:block}
.header-right{display:flex;align-items:center;gap:22px}
.demo-box .pill-tag{background:#fff;width:fit-content;margin:0}
.steps-list{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:24px}
.step-item{border-top:2px solid var(--ink);padding-top:16px}
.step-idx{display:block;font-size:28px;font-weight:800;color:var(--accent);letter-spacing:-.04em;margin-bottom:6px}
.step-item b{display:block;font-size:17px;font-weight:800;margin-bottom:4px}
.step-item span:not(.step-idx){font-size:14.5px;color:var(--mut)}
footer{margin-top:80px;padding-top:28px;border-top:1.5px solid var(--ink);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;font-size:14px;font-weight:600}
.footer-links{display:flex;gap:20px;flex-wrap:wrap}
.footer-links a{color:var(--accent);text-decoration:none;font-weight:800}
.footer-links a:hover{text-decoration:underline}
.fab{position:fixed;right:18px;bottom:18px;z-index:40;opacity:0;transform:translate3d(0,20px,0);pointer-events:none;transition:opacity .5s var(--ease),transform .5s var(--ease)}
body.ready .fab{opacity:1;transform:none;pointer-events:auto}

/* ===== REVEAL ===== */
.reveal{opacity:0;transform:translate3d(0,28px,0);transition:opacity .75s var(--ease),transform .75s var(--ease)}
.reveal.is-visible{opacity:1;transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}.d4{transition-delay:.32s}

@media(max-width:720px){.header-meta{display:none}.bg-star{width:420px;right:-160px}}
@media(max-width:600px){.cta-row .btn{width:100%;justify-content:center}.fab{left:18px;right:18px;justify-content:center}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important;scroll-behavior:auto!important}.track{animation:none}.bg-star{animation:none}}
</style>

  const intro = document.getElementById('intro'), logo = document.getElementById('logo');
  const DURACION = 2000; // ms que dura la intro (antes de que suba la cortina)

  // Mismo PNG de la estrella para el fondo (sin duplicar datos)
  document.getElementById('bgStar').src = logo.querySelector('.star').src;
  document.getElementById('yr').textContent = new Date().getFullYear();

  // Animación al hacer scroll
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
  }), { threshold: .12, rootMargin: '0px 0px -40px 0px' });
  const startReveal = () => document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  const finish = () => {
    intro.classList.add('hidden');
    document.body.classList.remove('lock');
    document.body.classList.add('ready');
    setTimeout(startReveal, 250);
    setTimeout(() => intro.remove(), 1000);
  };

  // Espera a que las imágenes estén decodificadas para que no se trabe
  const imgs = [...logo.querySelectorAll('img')].map(i => i.decode().catch(() => {}));
  Promise.race([Promise.all(imgs), new Promise(r => setTimeout(r, 1500))]).then(() => {
    requestAnimationFrame(() => requestAnimationFrame(() => logo.classList.add('go')));
    setTimeout(finish, DURACION);
  });

  // Menú
  const btn = document.querySelector('.menu-toggle'), menu = document.querySelector('.site-menu');
  const close = () => { menu.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); btn.setAttribute('aria-label', 'Abrir menú'); };
  btn.addEventListener('click', () => {
    const open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
    btn.setAttribute('aria-label', open ? 'Abrir menú' : 'Cerrar menú');
    menu.classList.toggle('open', !open);
  });
  menu.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
  document.addEventListener('click', e => { if (!menu.contains(e.target) && !btn.contains(e.target)) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
})();
</script>
